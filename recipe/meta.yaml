{% set version = "4.0.6" %}

package:
  name: procps-ng
  version: {{ version }}

source:
  url: https://gitlab.com/procps-ng/procps/-/archive/v{{ version }}/procps-v{{ version }}.tar.gz
  sha256: 1bbe8ff21dcd05a6adcda99a67d2e99cbd515c9e3a78fd3cc915b12aeb330d40

build:
  number: 0

outputs:
  - name: watch
    build:
      skip: true  # [win]
    script: build-watch.sh

    requirements:
      build:
        - {{ compiler('c') }}
        - {{ stdlib('c') }}
        - pkg-config
        - autoconf
        - automake
        - gettext
        - libtool
        - make
        - xz-tools
      host:
        - ncurses
      run:
        - ncurses
      run_constraints:
        - procps-ng <0.0.0a0
    test:
      commands:
        - watch --version

  - name: procps-ng
    build:
      skip: true  # [not linux]
    script: build-all.sh

    requirements:
      build:
        - {{ compiler('c') }}
        - {{ stdlib('c') }}
        - autoconf
        - automake
        - libtool
        - make
        - pkg-config
        - gettext
      host:
        - ncurses
      run:
        - ncurses

    test:
      commands:
        - $PREFIX/bin/ps
        - $PREFIX/bin/w
        - $PREFIX/bin/free

about:
  home: https://gitlab.com/procps-ng/procps
  license: GPL-2.0-or-later AND LGPL-2.0-or-later
  license_family: GPL
  license_file: COPYING
  summary: Command line and full screen utilities for browsing procfs, a "pseudo" file system dynamically generated by the kernel to provide information about the status of entries in its process table.

extra:
  recipe-maintainers:
    - dpryan79
    - pavelzw
